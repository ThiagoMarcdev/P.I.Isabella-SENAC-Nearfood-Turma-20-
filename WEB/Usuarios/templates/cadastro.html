<!DOCTYPE html>
<html lang="pt-BR">
<head>{% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>
<body>
    <div class="quadrado-meio">
        <div class="form-section">
            <h1>Cadastrar</h1>
            <button class="google-btn" onclick="simularGoogle()">
                <img src="https://imagepng.org/wp-content/uploads/2019/08/google-icon-1024x1024.png" alt="Google Icon"> Continuar com Google
            </button>
            
       
    <form id="formCadastro" method="POST">
        {% csrf_token %}
        <input id="firstName" name="firstName" type="text" placeholder="Primeiro nome" required>
        <input id="username" type="text" name="username" placeholder="Usuário" required>
        <input id="email" type="email" name="email" placeholder="Digite seu E-mail" required>
        <input id="telefone" type="tel" name="telefone" placeholder="Telefone" required>
        <input id="senha" name="senha" type="password" placeholder="Senha" required>
        <input id="confirmSenha" name="confirmSenha" type="password" placeholder="Confirme sua senha" required>
        <button type="submit" class="register-btn">CADASTRAR</button>
    </form>
        <p id="mensagem"></p>


        <p>Já tem conta? <a href="{% url 'login' %}">Login</a></p>
        

        </div>
        <div class="image-section">
            <div class="quadrado"></div>
            <div class="circulo"></div>
            <img src="{% static 'img/logos/entregador__imagem.png' %}">
        </div>
    </div>
    
</body>
<!-- <script src="../../static/js/cadastro.js"></script> -->
</html>
