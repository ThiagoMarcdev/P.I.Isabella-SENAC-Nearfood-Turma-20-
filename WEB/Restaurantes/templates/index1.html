<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearFood - Tela Inicial</title>
    <link rel="stylesheet" href="../../static/css/style1.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="{% url 'index' %}" class="nav-icon active"><i class="icon-home">🏠</i></a>
            <a href="{% url 'favoritos' %}" class="nav-icon"><i class="icon-bookmark">🔖</i></a>
            <a href="{% url 'detalhes' %}" class="nav-icon"><i class="icon-receipt">🧾</i></a>
            <a href="{% url 'config' %}" class="nav-icon settings-icon"><i class="icon-settings">⚙️</i></a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="logo">Near<span class="logo-highlight">F<span class="heart">❤️</span><span class="heart">❤️</span></span>d</div>
                <div class="search-bar">
                    <input type="text" placeholder="Buscar" id="searchInput">
                    <button class="search-btn">🔍</button>
                </div>
                <button class="theme-toggle" id="themeToggle">☀️</button>
                <a href="{% url 'login' %}">
                    <button class="login-btn">Fazer login</button>
                </a>
                
            </header>

            <!-- Promotion Banner -->
            <section class="promotion-banner">
                <div class="promo-badge">Promoção</div>
                <div class="promo-content">
                    <div class="promo-text">
                        <div class="promo-icons">
                            <span>🍽️</span>
                            <span>🍷</span>
                            <span>🍔</span>
                            <span>🍕</span>
                        </div>
                        <h2>50% OFF</h2>
                        <p>NA SUA PRÓXIMA RESERVA</p>
                    </div>
                    <button class="reserve-btn">RESERVE AGORA</button>
                </div>
            </section>
            <section class="restaurants-section">
                <h3>Restaurantes Próximos</h3>
                <div class="restaurants-grid" id="restaurantesGrid">
                    <!-- Restaurantes serão carregados via JavaScript -->
                </div>
            </section>

            <!-- Categorias -->
            <section class="categories-section">
                <h3>Categorias</h3>
                <div class="categories-grid">
                    <button class="category-btn">🍔 Lanches</button>
                    <button class="category-btn">🍕 Pizza</button>
                    <button class="category-btn">🍱 Japonês</button>
                    <button class="category-btn">🥪 Sanduíche</button>
                </div>
            </section>

            <!-- Recommendations -->
            <section class="recommendations-section">
                <h3>Recomendações para você</h3>
                <div class="recommendations-grid" id="recomendacoesGrid">
                    <!-- Recomendações serão carregadas via JavaScript -->
                </div>
            </section>

            <!-- Modal Pop-up -->
            <div class="modal-overlay" id="modalOverlay">
                <div class="modal-popup">
                    <button class="modal-close" id="modalClose">✕</button>
                    
                    <div class="modal-header">
                        <div class="modal-restaurant-logo" id="modalLogo">🍝</div>
                        <div class="modal-title-section">
                            <h2 id="modalNome">Bella Cucina</h2>
                            <p class="modal-tipo" id="modalTipo">Italiano</p>
                        </div>
                    </div>

                    <div class="modal-body">
                        <div class="modal-info-grid">
                            <div class="modal-info-item">
                                <span class="info-icon">⭐</span>
                                <div>
                                    <p class="info-label">Avaliação</p>
                                    <p class="info-value" id="modalAvaliacao">4.5</p>
                                </div>
                            </div>
                            <div class="modal-info-item">
                                <span class="info-icon">🕐</span>
                                <div>
                                    <p class="info-label">Tempo</p>
                                    <p class="info-value" id="modalTempo">15-20 min</p>
                                </div>
                            </div>
                            <div class="modal-info-item">
                                <span class="info-icon">📍</span>
                                <div>
                                    <p class="info-label">Distância</p>
                                    <p class="info-value" id="modalDistancia">1.2 km</p>
                                </div>
                            </div>
                        </div>

                        <div class="modal-description">
                            <p id="modalDescricao">Restaurante especializado em comida italiana com os melhores pratos da região.</p>
                        </div>

                        <div class="modal-actions">
                            <button class="modal-btn btn-route" id="btnVerRota">
                                <span>📍</span> Ver Rota
                            </button>
                            <button class="modal-btn btn-reserve" id="btnFazerReserva">
                                <span>📅</span> Fazer Reserva
                            </button>
                            <button class="modal-btn btn-more" id="btnVerMais">
                                <span>➡️</span> Ver Mais
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../static/js/main1.js"></script>
</body>
</html>
